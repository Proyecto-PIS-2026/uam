name: CD - Deploy Testing

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: testing

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Emitir contrato y aplicar migraciones en Testing
        run: |
          npm run db:contract
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.TESTING_DATABASE_URL }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Descargar imagen base de Node
        run: |
          for intento in 1 2 3; do
            echo "Intento $intento de descargar Node.js"

            if docker pull node:24-alpine; then
              echo "Imagen descargada correctamente"
              exit 0
            fi

            if [ "$intento" -lt 3 ]; then
              echo "Reintentando en 15 segundos..."
              sleep 15
            fi
          done

          echo "No fue posible descargar la imagen"
          exit 1

      - name: Desplegar en Testing
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: uamgrupo10acr.azurecr.io
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}
          containerAppName: uam-testing
          resourceGroup: Proyecto-PIS-2026
          environmentVariables: |
            DATABASE_URL=${{ secrets.TESTING_DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}