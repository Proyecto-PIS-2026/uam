name: CD - Deploy Testing

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: testing

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check DATABASE_URL secret
        run: |
          if [ -z "${{ secrets.TESTING_DATABASE_URL  }}" ]; then
            echo "TESTING_DATABASE_URL  secret is EMPTY"
            exit 1
          else
            echo "TESTING_DATABASE_URL  secret exists"
          fi

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: uamgrupo10acr.azurecr.io
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}
          containerAppName: uam-testing
          resourceGroup: Proyecto-PIS-2026
          buildArguments: DATABASE_URL=${{ secrets.TESTING_DATABASE_URL }}
