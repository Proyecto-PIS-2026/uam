name: CI - Release to Main

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  verify-release:
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uam
          POSTGRES_PASSWORD: uam_local
          POSTGRES_DB: uam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uam -d uam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://uam:uam_local@localhost:5432/uam?schema=public"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        with:
          node-version: '24'
          cache: 'npm'
        uses: actions/setup-node@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migraciones de base de datos
        run: npm run db:migrate

      - name: Ejecutar Suite de Regresión (Vitest)
        run: npm run test:unit -- --run

      - name: Instalar Navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Sembrar Base de Datos de Staging (Pre-Tests)
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Ejecutar Tests E2E de Regresión en Staging
        run: |
          npx playwright test --config=playwright.config.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Restaurar Base de Datos de Staging
        if: always()
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}