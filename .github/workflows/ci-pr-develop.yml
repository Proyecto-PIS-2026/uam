name: CI - PR to Develop

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  validar-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Validar título del Pull Request
        shell: bash
        run: |
          TITULO="${{ github.event.pull_request.title }}"

          if [[ ! "$TITULO" =~ ^(feat|fix|test|refactor|chore):\ .+ ]]; then
            echo "El título del Pull Request no cumple la convención definida."
            echo "Debe comenzar con feat:, fix:, test:, refactor: o chore:"
            exit 1
          fi

      - name: Agregar label según el tipo de cambio
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = context.payload.pull_request.title;
            const tipo = titulo.split(':')[0];

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [tipo]
            });

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uam
          POSTGRES_PASSWORD: uam_local
          POSTGRES_DB: uam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uam -d uam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://uam:uam_local@localhost:5432/uam?schema=public"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint

      - name: Sincronizar Esquema con Prisma 8
        run: npx prisma db update

      - name: Ejecutar Tests Unitarios (Vitest)
        run: npm run test:unit -- --run